# Secret-scanning config for the gate that docs/standards/guardrails.md § CI
# promises. Wired into scripts/check.sh (so local and CI cannot drift) and run
# in .github/workflows/ci.yml against the full history.
#
# Run it yourself:  gitleaks dir . --no-banner --redact
title = "Blacksmith"

[extend]
useDefault = true

[[rules]]
# The default generic-api-key rule is the one that fires here, and it fires on
# prose, not on credentials: several epic specs quote a deliberately fake token
# while *specifying* the redaction rule that must catch it. Allowlisting the
# literal keeps the rule armed for anything else shaped like a key.
id = "generic-api-key"
[rules.allowlist]
description = "Fixture credential named in envkit-mcp spec acceptance criteria"
regexes = ['''sk-live-0123456789abcdef''']

[allowlist]
description = "Paths that hold names of secrets, never values"
paths = [
  # Variable NAMES only — guardrails.md § Secrets makes this the one
  # committed env file, and a value landing in it is exactly what the gate
  # should catch, so it is deliberately NOT allowlisted:
  #   '''\.env\.example$''',
  # The clone's own `.env`, and only it. `docs/runbooks/providers.md` tells an
  # operator to put a provider key here and `factory/orchestrator/src/dotenv.ts`
  # now reads it, so on any box that followed the runbook this file holds a real
  # credential. `gitleaks dir` walks the working tree rather than the index, so
  # it found one and failed the gate for doing exactly what the repo asked
  # (D-270).
  #
  # This is not a hole in the guard. The guard exists to stop a credential
  # reaching the tree, and `.gitignore:21` means this file cannot get there.
  # What keeps the two honest is a test: `dotenv.test.ts` asserts `git
  # check-ignore` still claims `.env`, so this line cannot outlive the ignore
  # that justifies it. `.env.local` and its siblings are deliberately NOT
  # here -- the runbook names one file, and a key in any other still fails.
  '''^\.env$''',
  '''pnpm-lock\.yaml$''',
  '''ui/e2e/__screenshots__/''',
]
