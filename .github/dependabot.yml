# Keeps the pinned GitHub Actions current, one grouped PR a week, through the
# same gate as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['dependencies']
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
