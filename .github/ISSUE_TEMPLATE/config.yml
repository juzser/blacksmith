# Security and Code of Conduct reports must never land in a public issue. These
# links put the private channel where the reporter chooses a form.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/juzser/blacksmith/security/advisories/new
    about: >-
      Opens a private advisory visible only to you and the maintainers. Never
      a public issue, and never with a credential in it. See SECURITY.md.
  - name: Report a Code of Conduct concern (private)
    url: https://github.com/juzser/blacksmith/security/advisories/new
    about: >-
      Use the same private channel. See CODE_OF_CONDUCT.md.
  - name: Read the docs first
    url: https://github.com/juzser/blacksmith/blob/main/docs/usage.md
    about: Rules, agents and compact.
