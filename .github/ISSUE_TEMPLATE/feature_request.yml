name: Feature request
description: Propose a change to the plugin, the cross-check skill or pr-mod.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Blacksmith is deliberately small: five pieces, and Claude Code's
        defaults for the rest. See the
        [docs](https://github.com/juzser/blacksmith/blob/main/docs/README.md)
        and [what it no longer does](https://github.com/juzser/blacksmith/blob/main/docs/history.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, in your own workflow. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules (plugin/rules.md)
        - Agents
        - Cross-check
        - Compact
        - pr-mod
        - Docs / install
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or ruled out
