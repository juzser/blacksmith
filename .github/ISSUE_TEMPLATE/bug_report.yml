name: Bug report
description: The plugin, the cross-check skill, the audit skill or the gate behaves wrong.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a credential.** Describe its shape, never the value.
        Security bugs are private, not here: see
        [SECURITY.md](https://github.com/juzser/blacksmith/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The shortest path from a fresh install. Commands, and the prompt if one is involved.
      render: shell
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: '`claude --version`, the plugin version, and `codex --version` if cross-check is involved.'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL2
        - Other / native Windows
    validations:
      required: true

  - type: textarea
    id: gate
    attributes:
      label: Tail of `bash scripts/check.sh` (if you ran it from a clone)
      description: The last ~30 lines, SKIP lines included.
      render: shell
