name: CI

# The one gate is scripts/check.sh, the same file a contributor runs locally.
# `push: main` as well as `pull_request`: a merge produces a commit no PR run
# ever tested.
on:
  pull_request:
  push:
    branches: [main]

# One run per branch: a second push supersedes the first. A landed commit is
# exempt, and gets a group of its own keyed by sha, so every commit on main
# keeps its own verdict.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  gate:
    # The ruleset on `main` requires exactly this name. Do not rename it.
    name: gate (scripts/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # CI has no `claude`, so the plugin validators print SKIP there; the
      # plugin tests, JSON, marketplace and link checks all run.
      - name: Run the gate
        run: bash scripts/check.sh
