name: E2E

# Dormant until package.json has a `test:e2e` script. One small `detect` job
# reads it; the shard and summary jobs wait on it, so a project with no e2e
# suite pays one checkout per run and starts no shard runner (a job-level `if`
# on a `needs` output skips the whole matrix before any runner is allocated).
#
# Fires on exactly the events ci.yml fires on, so every event that runs the
# tier jobs also runs the `e2e` check they leave to this workflow.
on:
  pull_request:
  push:
    branches: [main, setup]

# Same rule as ci.yml under a prefix of its own: concurrency groups are shared
# by every workflow in a repository, so one group would let ci.yml and this
# workflow cancel or queue each other.
concurrency:
  group: e2e-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          present=$(node -p "(s => typeof s === 'string' && s !== '')(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts?.['test:e2e'])")
          echo "present=$present" | tee -a "$GITHUB_OUTPUT"

  shard:
    name: e2e shard ${{ matrix.shard }}/2
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A red shard must not cancel the other: both shards' screenshots are
      # evidence for the run.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser download is cached on the exact Playwright version the
      # lockfile pins; a new Playwright pins a new Chromium, so only a version
      # bump misses. System libraries are not in this cache, so they are
      # installed on every run.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Chromium download
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      - name: Run e2e (shard ${{ matrix.shard }}/2)
        id: e2e
        timeout-minutes: 10
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/2

      # Evidence, not the verdict: uploaded even when e2e failed, never when it
      # did not run, and a failed upload must not turn a green run red.
      - name: Upload screenshots
        if: always() && steps.e2e.conclusion != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  # Skipped while `detect` reports no suite, so a dormant workflow shows no
  # passed e2e job. Otherwise it runs even when a shard failed, and fails
  # unless every shard succeeded; a failed `detect` leaves it red, not skipped.
  e2e:
    needs: [detect, shard]
    if: ${{ !cancelled() && needs.detect.outputs.present != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed
        env:
          SHARDS_RESULT: ${{ needs.shard.result }}
        run: |
          echo "e2e shards: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = "success"
