name: CI

on:
  pull_request:
  push:
    # `setup` is the branch `smith new` creates and the operator first pushes;
    # naming only `main` meant this workflow could not fire at all on a fresh
    # project, because a fresh project has no main yet. Both are named so CI
    # covers the scaffold's whole life, not just the half after the first merge.
    branches: [main, setup]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile is safe here: `smith new` installs before it commits,
      # so pnpm-lock.yaml is in the scaffold's first commit.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run typecheck:test
      # Runs the suite AND enforces the coverage floor vitest.config.ts
      # declares — a separate `pnpm run test` step would only pay for the suite
      # twice, and leaving coverage out is how a declared floor ends up enforced
      # by nothing but the factory's own gate.
      - run: pnpm run test:coverage
      - run: pnpm run build
