# Blacksmith — scheduler policy
#
# Knobs for `factory/orchestrator/src/scheduler.ts` (architecture §12
# "Recheck scheduling" + "Scheduled growth passes"; `smith scheduler run`).
# A deterministic pass over the event log that only ever emits PROPOSAL
# events — it never dispatches an agent or widens scope on its own.

recheck:
  # architecture §12: "re-open a recheck task when (a) N later merges touch
  # its claim paths, (b) T days elapse, or (c) its confidence score at
  # completion was below a threshold."
  merge_threshold: 5 # (a) N later merges touching the same claim paths
  days_elapsed: 14 # (b) T days since the feature completed
  confidence_threshold: 0.6 # (c) completion confidence below this triggers a recheck

maintenance:
  # agent-constraints.md "planner / Growth passes": maintenance-pass
  # proposals may auto-schedule at high confidence; product-growth never
  # does. Confidence here is scheduler.ts's own deterministic heuristic
  # (major-version bumps present -> lower confidence), not a model verdict.
  auto_schedule_confidence: 0.8
  major_bump_confidence: 0.5
  minor_or_patch_confidence: 0.9

growth:
  # architecture §12 "product-growth pass": the scheduler only emits the
  # growth-review-due TRIGGER event on this cadence — the planner session
  # is the one that reads the living spec/analytics and proposes scope, and
  # that proposal always waits for an operator tick regardless of confidence.
  cadence_days: 30

lessons:
  # architecture §9.3 novelty gate: cheap deterministic similarity
  # (normalized word-shingle Jaccard) against existing candidate + approved
  # lesson statements. >= this score is "clearly redundant" -> auto
  # novelty-rejected, no LLM call. Below it, Phase 7 queues the candidate as
  # novel; the "uncertain -> one LLM merge step" middle tier architecture §9
  # describes (SAGE) is a documented future upgrade, not built here.
  novelty_jaccard_threshold: 0.8
  shingle_size: 3
  # Correct that threshold for how long the two statements are before
  # comparing them (P9-35 (a)). A statement has n-s+1 shingles, and changing
  # one word destroys s of them, so nothing shorter than ~29 words can score
  # 0.8 against its own near-copy: at a fixed bar, restating a shorter lesson
  # with one word changed read as a new lesson. Set false for one bar per
  # pair; below 2*shingle_size+1 words the correction stands aside either way,
  # because there a one-word edit and a coincidence score the same.
  novelty_length_aware: true

autonomy:
  # Who says yes to what this pass proposes. The scheduler decides WHAT is
  # due; this block decides what may proceed without an operator tick, and
  # `smith scheduler admit` (src/autonomy.ts) applies it. That command still
  # enacts nothing — it prints the classification so it can be read and
  # argued with before anything moves.
  #
  # The operator's standing decision, 2026-09-02: auto-dispatch with a
  # whitelist. Rechecks and maintenance may run themselves; growth review
  # and anything touching a security surface always wait; PRs are still
  # merged by a person, which is the backstop that makes this safe to widen.
  enabled: true

  # Nothing outside this list is ever auto-dispatched, and listing
  # `growth-review-due` would not change that: architecture §12 keeps scope
  # with the operator unconditionally, so autonomy.ts denies it whatever this
  # says. The list is a ceiling, never a floor.
  auto_dispatch_kinds: [recheck, maintenance]

  # Rechecks are whitelisted BY REASON, and this is the one knob in the file
  # that is easy to get backwards. A RecheckProposal's `confidence` is the
  # COMPLETED TASK's confidence, and a low one is why the recheck exists at
  # all — gating rechecks on confidence the way maintenance is gated would
  # hold back precisely the rechecks worth running. So:
  #   merge-threshold  — N later merges touched its claims; re-running the
  #                      same checks against moved ground is routine.
  #   time-elapsed     — T days passed; likewise routine.
  #   low-confidence   — the work itself was uncertain when it completed.
  #                      Left out: that is a judgement about quality, and it
  #                      is the operator who should read it first.
  # One unlisted reason holds the whole proposal — a recheck is dispatched
  # once and carries every reason with it.
  auto_dispatch_recheck_reasons: [merge-threshold, time-elapsed]

  # Maintenance only. Matches maintenance.auto_schedule_confidence above,
  # repeated rather than imported for the same reason crosscheck.yml repeats
  # its own copy: "auto-schedulable" and "may run unattended" are allowed to
  # diverge later, and the day they do, one of them moving must not move the
  # other by accident. scheduler.ts scores a major-version bump at 0.5
  # precisely so a person reads it.
  confidence_floor: 0.8
