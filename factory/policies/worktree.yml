# Blacksmith — worktree + merge-queue policy
#
# architecture §5 "Worktree partitioning (no overlap, no conflicts)".
# Conflicts are prevented at planning time, not resolved at merge time.

worktree:
  # D-42 correction (phase 9): worktrees live OUTSIDE the project root, as a
  # sibling of it. They used to be at "workspaces/<project>/wt/<task-id>" —
  # inside the root — and each one is a full checkout carrying the project's
  # own tool config. A tool that walks down from the project root therefore
  # found N+1 root configs and refused to run: the envkit epic's `pnpm lint`
  # exited 1 at the integration root without reading a source file, while all
  # six per-task lint gates were green (from inside a worktree, the siblings
  # are not descendants, so no task gate could see it). A sibling path is one
  # no root-walking tool can reach without climbing up, which retires the
  # class rather than the one tool.
  path_pattern: "workspaces/.wt/<project>/<task-id>"
  branch_pattern: "smith/<epic>/<task-id>"
  created_from: integration branch head (smith/<epic>/integration), fresh each time
  lifecycle: deleted after merge — a stale worktree is a bug
  one_worktree_per_task: true

integration_branch:
  # Phase-3 correction: a bare "smith/<epic>" ref cannot coexist with
  # "smith/<epic>/<task-id>" refs — git's ref namespace is hierarchical, so a
  # leaf ref and a directory prefix of the same name conflict (D/F conflict,
  # confirmed against a real git repo while implementing worktree.ts). The
  # integration branch is therefore a sibling of task branches under the
  # epic's ref prefix, not a leaf at "smith/<epic>" itself.
  pattern: "smith/<epic>/integration"
  rule: workers never touch main/master; only the operator merges the
    integration PR into the target repo's main.

claims:
  disjointness_required: true
  computed_from: static analysis (import/dependency graph) over the target
    repo, cut along low-cohesion lines (community detection) — never
    assigned from epic text alone.
  overlap_handling: >
    tasks with overlapping claims are never scheduled concurrently; they
    get a dependency edge (edge_type: claim-order) and run serially instead.
  enforcement: >
    a post-run check diffs the worktree against its declared claims;
    out-of-claim edits fail the gate (error contract.claim-violation,
    severity S3 unless the edit touches a guardrail-protected file, then S1)
    and bounce back to the coder.

serialize_always_globs:
  # shared-file hotspots (architecture §5.5) — any task touching these is
  # never scheduled concurrently with another such task.
  globs:
    - "**/pnpm-lock.yaml"
    - "**/package-lock.json"
    - "**/*.generated.*"
    - "**/dist/**"
    - "db/migrations/**"
    - "src/routes/**/index.ts"     # route registries
    - "src/types/**"               # shared types (hub files)
    - "src/config/**"              # shared config (hub files)
    - "tests/fixtures/**"          # shared fixtures (hub files)
  note: >
    Hub files are structurally central (types, config, shared fixtures,
    route registries) and are never split across concurrent tasks — single
    owner, or regenerated by the merge queue (regenerable files like
    lockfiles are never hand-edited by workers).

merge_queue:
  mode: serial
  order: dependency order (topological, per recorded edges)
  admission_steps:
    - rebase task branch onto current smith/<epic>/integration head
    - run the cumulative regression gate (every previously merged task's
      tests in this epic, not just the incoming task)
    - admit on green; reject and bounce on red
  conflict_resolution_ladder:
    - step: automatic rebase attempt
    - step: dispatch merger agent with both diffs + both task specs
    - step: >
        escalate to operator with a side-by-side when merger confidence is
        low or both sides changed the same logic — never auto-resolve a
        semantic conflict silently
  stacked_layers:
    enabled: true
    max_lines_per_layer: 200
    note: >
      workers emit small stacked layers (within the 400-line task diff cap)
      rather than monolithic diffs; the queue lands stacks in dependency
      order (GitHub native stacked PRs).
