# Blacksmith — multi-provider cross-check policy
#
# architecture §6 "Multi-provider cross-check (anti tunnel vision)". The
# judge tier is provider-agnostic by contract; the config seam has existed
# since Phase 1, and Phase 8 (`factory/orchestrator/src/providers/`,
# `src/quorum.ts`) wires it up for real: `transport` selects which
# transport module runs a provider (cli-transport.ts / api-transport.ts),
# `mode` gates how much power its verdict has (see below). `enabled: false`
# means never invoked at all, regardless of `mode`, and both external
# providers ship that way. Not a judgement about them: `enabled` is the one
# field in this file that describes a MACHINE rather than the contract — it
# answers "does this box have that judge", and for a box the repo has never
# seen the honest answer is no. Switched on where the precondition is unmet a
# provider does not fail loudly; it spends a doomed call on every quorum
# trigger, has it caught, and leaves a failure row that reads like an outage.
# So turn on the one you actually have — a one-line edit, runbook §2, and
# `smith judge preflight` says beforehand whether it will work.
# Full setup/calibration/promotion procedure: docs/runbooks/providers.md.
#
# Shadow mode (Phase 8 design decision): `mode: shadow` means a provider's
# verdicts are RECORDED (judge-verdict events, `smith stats providers`) but
# have ZERO gating power — quorum.ts falls back to the native verdict alone
# whenever no provider in a case is `mode: active`. Flipping a provider to
# `mode: active` in this file (an operator edit, never a runtime write) is
# the entire promotion step; `mode: shadow` or `enabled: false` is the
# entire rollback step.

providers:
  claude:
    kind: native
    enabled: true
  codex:
    kind: api
    transport: cli          # `codex exec` headless — ChatGPT-subscription auth (`codex login` once), no API key spend. See docs/runbooks/providers.md.
    command: codex
    # NOT `--json` (D-118): that wraps the verdict as an escaped string inside
    # an `item.completed` event, where no JSON scanner can reach it, and puts a
    # `thread.started` banner ahead of it. Plain `exec` writes the agent's final
    # message — and only that — to stdout.
    #
    # Re-derived against the live binary on 2026-08-17, codex-cli 0.147.0, on a
    # subscribed account (D-118 was originally derived from two calls made while
    # the account was near its quota limit). Both layers still hold, unchanged:
    # `--json` still nests the verdict in `item.completed.item.text`, and plain
    # `exec` still echoes the whole prompt to stderr — which the transport merges
    # into its extraction buffer by design — so a prompt containing `[]` or `{}`
    # still plants decoy JSON ahead of the answer. Over that real buffer the two
    # extractor generations diverge exactly as D-118 claimed: first-parseable
    # returns `[]`, first-validating returns the verdict. If you change these
    # args, re-run that comparison rather than reasoning about it.
    args: ["exec", "--color", "never"]
    model_tier: mid          # taxonomy.yml model_tier — judge tier, architecture §4
    # PRECONDITION: `codex` on PATH, and `codex login` run on every machine
    # that dispatches a quorum trigger. Without either the CLI transport still
    # spawns, fails, and quorum.ts records a provider error per trigger —
    # caught, so nothing gates on it, but it is latency and noise.
    # `smith judge preflight` checks the first half locally; only a real call
    # can check the second.
    # `auto`, not `true`. This is the one field in the file that describes a
    # MACHINE, and the file is checked in, so `true` here would be a claim
    # about every clone: the day this was written `true`, CI — which has no
    # `codex` binary — started failing `judge preflight`'s soundness check,
    # correctly, for a line that was true where it was typed.
    #
    # `auto` resolves against the precondition above, on the box reading the
    # file: `codex` on PATH means enabled, no `codex` means silently off, and
    # neither box needs to edit this line. What it cannot know is the second
    # half — whether `codex login` was run — so a box with the binary and no
    # session still spends a call per trigger and records the failure.
    #
    # Turned on for THIS box, 2026-09-02, by the operator who owns it: `codex`
    # resolves on PATH and `codex login` is done, both checked by `smith judge
    # preflight` and by a real `codex exec` call. Rollback for one box is
    # `enabled: false` here, which `auto` never overrides.
    enabled: auto
    # `active`, not `shadow`: the operator's call (docs/runbooks/providers.md
    # §3 offers shadow-then-calibrate and this box declined it).
    #
    # Be exact about what that buys today, because it is less than it looks:
    # a shadow provider is still CALLED and still recorded as a participant
    # (quorum.ts header note) — shadow costs the same call and forfeits only
    # gating power. With one external judge promoted and `min_providers: 2`,
    # a finding claude raised escalates either way. The difference is where
    # codex's rationale lands: under `gating.rationales` when active, only
    # under `participants` when shadow.
    #
    # So the promotion is not what makes the cross-check real — a second
    # provider is (see quorum_rule.accept_non_gating_actives). What it does
    # is make this box gate the moment one is enabled, with no second edit
    # and no second decision to remember. Rollback is `mode: shadow` here.
    mode: active
  deepseek:
    kind: api
    transport: api
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    response_format_json_object: true
    api_key_env: DEEPSEEK_API_KEY
    model_tier: mid
    # PRECONDITION: DEEPSEEK_API_KEY must be set in the dispatching environment.
    # Without it api-transport.ts throws `Environment variable "DEEPSEEK_API_KEY"
    # is not set` on every quorum trigger; quorum.ts catches it, so the gate
    # holds on the native verdict alone, but each trigger records a provider
    # error. `smith judge preflight` reports the name it looked for and never
    # the value it found, so it is safe to run anywhere.
    enabled: false     # ships off: the key belongs to a runner, and the repo has never met one
    mode: shadow       # flip to `active` only after a calibration pass (docs/runbooks/providers.md)

quorum_triggers:
  # architecture §6, agent-constraints.md "cross-check (phase 8)" — all four,
  # nothing more.
  - any S1/S2 finding, before it blocks a task
  - epic-level final verdict, before the integration PR opens
  - same-mistake findings (judgment.same-mistake)
  - planner verdicts below the confidence threshold

plan_quorum:
  # architecture §6 "Plan quorum" — critique-only, never committee writes.
  triggers:
    - epic budget ≥ 50% of budgets.yml per-epic cap
    - epic case is infra, or carries a security-sensitive tag
    - planner verdict confidence below threshold
  judges: 2 providers distinct from the planner's
  on_disagreement: surface both rationales to the operator with the plan
  # Machine-readable form of the three triggers above, read by
  # src/crosscheck.ts's parsePlanQuorum() -> src/planQuorum.ts's
  # evaluatePlanQuorumTriggers(). The prose above is the human contract;
  # these fields are what the code actually gates on.
  budget_ratio: 0.5 # trigger 1: sum(plan.tasks[].budget.tokens) >= this * budgets.yml epic.cap_tokens
  # Same line task-spec.schema.json's `confidence` field and scheduler.yml's
  # maintenance.auto_schedule_confidence both draw (>=0.8 auto-schedules).
  # Repeated here (not imported) because this is a crosscheck trigger, not a
  # scheduling decision — the two policies are allowed to diverge later.
  confidence_threshold: 0.8 # trigger 3
  security_cases: [infra] # trigger 2, taxonomy.yml `case` vocabulary
  security_roles: [security-reviewer] # trigger 2, taxonomy.yml `agent` vocabulary
  # trigger 2's third arm: contract.nonfunctional_clauses text matched
  # case-insensitively as a substring (task-spec.schema.json has no `tags`
  # field to check instead).
  security_keywords:
    - auth
    - authz
    - authentication
    - authorization
    - credential
    - secret
    - token
    - password
    - crypto
    - encryption
    - tls
    - injection
    - xss
    - csrf
    - sandbox
    - permission
    - privilege
    - sanitize
    - escalation

quorum_rule:
  agreement: "2-of-3"
  min_providers: 2
  tie_break: a third provider breaks the tie, or the case escalates to the
    operator with both rationales side by side.
  # This box promotes exactly one external judge (see providers.codex), and one
  # cannot meet min_providers 2. On a finding claude raised — which is nearly
  # all of them, since gate.ts defaults a finding's finder to the native
  # provider — claude is excluded as the finder, the gating pool is [codex]
  # alone, and the case escalates for insufficient-providers just as it did
  # before the promotion, now having paid for the call.
  #
  # Set true because that is still the better trade here, not because the
  # arithmetic is in doubt: the escalation now carries a second model's
  # rationale instead of none, and the day a second provider is enabled the
  # pool meets the rule with no further edit. What it buys today is a human
  # deciding with two opinions in front of them rather than one — which is the
  # whole point of the file — not an automatic override.
  #
  # It silences one advisory in `smith judge preflight` and nothing else. A
  # provider enabled where it cannot be called is still a problem, and
  # `gating.canDecide` still reports false, because it is false.
  accept_non_gating_actives: true

asymmetric_roles:
  finder_ne_critic: true
  critic_mandate: refute, not confirm
  # The machine-readable form of finder_ne_critic (P9-23). Each pair says
  # "this critic must not run on that finder's own model"; `smith dispatch
  # check <session>` asserts it against the event log after the fact, using
  # the `model` field every dispatch_decision now carries. Without this list
  # the rule was unenforceable prose: it named no roles.
  pairs:
    - finder: planner
      critic: spec-reviewer
    - finder: reviewer
      critic: verifier
  note: >
    adversarial stage-gating is expected to kill most candidate findings
    before they cost a round-trip (Refute-or-Promote, §17); reviewer quality
    is tracked as kill-rate (findings that survive verification and land as
    verified fixes), never findings volume.

role_isolation:
  # The other half of "a worker never grades its own work". `finder_ne_critic`
  # above compares MODELS, which is the wrong question for a tester: a tester
  # may legitimately run on the coder's model, and forcing a second vendor onto
  # it would buy nothing. What it may not do is run inside the coder's own
  # turn — a coder that writes its own tests grades itself, and every gate
  # downstream still goes green.
  #
  # The only evidence of a separate turn the event log can hold is a separate
  # `dispatch_decision`, written by the node that dispatched, never by an agent
  # about itself. `smith tester check <session>` asserts that against the log
  # after the fact, per `testgate-result`.
  #
  # That reading survives delegation.yml granting `Agent` because of what the
  # grant costs: a grantee must open its own session first, so its dispatches
  # are its own log's, and no grant may hand a role its own auditor from the
  # `pairs` below. `smith delegation check` enforces both, which is what keeps
  # a widened grant from quietly disarming this file.
  #
  # One entry, and it is meant to stay one until a second role starts grading
  # work it could have written: every other grader in the pipeline is a judge,
  # and a judge cannot write at all (`role_write_scopes` in guardrails.yml).
  pairs:
    - worker: coder
      auditor: tester
  note: >
    the audit answers "was a tester dispatched separately, and did it report,
    before this task's tests were graded?" — not "did that tester write the
    tests". Nothing in the log distinguishes a test file the tester authored
    from one it merely ran; `role-write-scope` fences where a leased tester may
    write, and the two checks are complementary, not substitutes.

independent_finder:
  # Everything else on this page is SUBTRACTIVE. quorum.ts's vocabulary is
  # `confirm | refute`, a critic is handed one claim and told to kill it, and
  # the strongest thing a quorum can do is drop a finding the native reviewer
  # already raised. That makes the external tier a brake and never an eye: a
  # bug the native reviewer's context did not surface is a bug no amount of
  # cross-checking will ever reach, because nothing outside that context is
  # ever asked to look.
  #
  # This block is the other direction. A finder from a different vendor reads
  # the same diff in a fresh context, returns its own evidence, and
  # crossFinding.ts reconciles the two lists. A quorum can now RAISE.
  #
  # Three things it deliberately does not do:
  #
  # 1. Silence is not a refutation. A native finding the independent finder did
  #    not raise stays exactly as it was. The finder was never asked about that
  #    claim — it was asked to read a diff — so its not mentioning something is
  #    absence of evidence. Subtracting on it would let a lazy or truncated
  #    second opinion delete real findings.
  # 2. Same file and category with different wording is not the same finding.
  #    That is `co-located`: recorded for the operator, never merged and never
  #    auto-raised, because nothing here can tell one bug described twice from
  #    two bugs in one function.
  # 3. An independent-only finding is minted, not privileged. It enters the
  #    gate as an ordinary finding and, at S1/S2, meets the same
  #    `quorum_triggers` critic as any other — so a third-party vendor's
  #    unshared opinion still has to survive a refute pass before it blocks.
  enabled: false     # ships off: this is the one judge call that costs a diff
  mode: shadow       # reconciliations are recorded and gate nothing; flip to `active` only after a calibration pass (docs/runbooks/providers.md)
  # No code default: crosscheck.ts falls back to an EMPTY list, so this line is
  # the only place a vendor is ever chosen. Delete it and the finder refuses by
  # name rather than picking one for you.
  providers: [codex] # must be external and must not be the native provider — a "second opinion" from the same model is one opinion billed twice
  # THE OPERATOR MANDATE. A critic judges a CLAIM, so quorum.ts can send the
  # summary and the failure scenario and never the source. A finder cannot: it
  # has nothing to read but the diff. Shipping worktree source to a third-party
  # API is a decision no code in this repo has standing to make quietly, so it
  # is a switch, it ships false, and `smith crossfind run` REFUSES rather than
  # falling back to a diffless "find bugs" prompt that would invent findings.
  send_diff: false
  max_diff_bytes: 120000 # refuse rather than truncate: half a diff produces confident findings about code that is not there
  # How a fingerprint both sides raised resolves when they disagree on how bad
  # it is. `highest-wins` takes the worse of the two; `native-wins` keeps the
  # native severity and records the disagreement without acting on it.
  severity_resolution: highest-wins

mechanical_oracles_first: >
  wherever a deterministic check exists (schema validation, mutation
  testing, coverage, type checks), it runs first and its verdict is final —
  LLM judgment, cross-provider or not, is reserved for what machines can't
  decide.

trust_boundary: >
  external providers judge; they never gain write access to worktrees or the
  factory. Their findings are data, not commands. All external calls go
  through the same event log and budget accounting as native dispatches.
