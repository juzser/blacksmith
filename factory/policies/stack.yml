# Blacksmith — stack answers
#
# What the operator answered when they installed this clone (INSTALL.md
# Step 6, "The stack interview"). Read by `factory/orchestrator/src/stack.ts`
# via `smith stack show`, and through it by the scaffolder and by every agent
# that needs to know what this operator builds with.
#
# This file used to be a document. `docs/standards/stack.md` shipped one
# operator's 2026-08-03 answers — Vue, Cloudflare, Drizzle, a private design
# system — written as if they were the product, and every clone of a public
# repo inherited them. They are answers, so they live here as data, and the
# defaults below are the ones that assume least: `none` wherever an unanswered
# question would otherwise put words in the operator's mouth.
#
# Not every answer is executable. The shipped templates implement a subset —
# `smith stack check` prints which of your answers they honour and which are
# recorded for the agents to read but not built into `smith new`. Nothing here
# silently pretends: an answer the templates cannot honour makes `smith new`
# refuse rather than scaffold something else.

# ── Language ────────────────────────────────────────────────────────
# What the coder writes. `typescript` is the only value the shipped templates
# scaffold; any other value is recorded, and `smith new` refuses rather than
# handing you a TypeScript project you did not ask for.
language: typescript # typescript | javascript | python | go | rust | other

# ── Frontend ────────────────────────────────────────────────────────
# `none` is the default because most projects are not UI projects, and the
# base template is a plain library. `smith new --ui` needs a value the
# templates implement — today that is `vue` and nothing else.
frontend: none # none | vue | react | svelte | solid | vite-vanilla | other

# The design system a UI project builds against. `none` means the project owns
# its own components, which is what a new project has on day one, and what the
# uiux agent grounds its specs in when there is nothing else to ground them in.
#
# Naming one changes two things: the uiux agent is told to spec against it
# instead of inventing patterns, and `design_system_source` (if set) is
# vendor-copied into each scaffolded UI project. Vendored, never referenced
# from an external repo — a design system you cannot build offline is a
# dependency on someone else's uptime.
design_system: none # none | <name>
design_system_source: '' # path to a directory to vendor into <project>/design/, or empty

# The utility layer under the components.
styling: plain-css # plain-css | tailwind | css-modules | vanilla-extract | other

# ── Backend / runtime ───────────────────────────────────────────────
backend: none # none | node | deno | bun | cloudflare-workers | other
database: none # none | sqlite | postgres | mysql | d1 | other
orm: none # none | drizzle | prisma | kysely | other

# ── Repo shape + tooling ────────────────────────────────────────────
package_manager: pnpm # pnpm | npm | yarn | bun
repo_shape: single # single | monorepo
lint: biome # biome | eslint-prettier | none
test_unit: vitest # vitest | jest | node-test | none
test_e2e: playwright # playwright | cypress | none
ci: github-actions # github-actions | gitlab-ci | circleci | none
hosting: unspecified # free text — where this operator deploys, or `unspecified`
